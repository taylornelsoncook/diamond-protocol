# Render blueprint: New → Blueprint → pick this repository. Fill in the secret values in the dashboard.
services:
  - type: web
    name: diamond-protocol
    runtime: docker
    plan: starter            # persistent disks need a paid instance
    region: ohio
    healthCheckPath: /healthz
    numInstances: 1          # SQLite: exactly one instance
    disk:
      name: data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: DP_TEST_MODE
        value: "false"
      - key: PUBLIC_URL
        sync: false           # e.g. https://app.diamondprotocol.com
      - key: BUSINESS_TZ
        value: America/Chicago
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false           # only for the first start; remove after you sign in
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
