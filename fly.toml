# Fly.io: `fly launch --copy-config --no-deploy`, then `fly volumes create data --size 5`, set secrets, `fly deploy`.
app = "diamond-protocol"
primary_region = "ord"

[build]

[env]
  DP_TEST_MODE = "false"
  BUSINESS_TZ = "America/Chicago"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"     # billing, reminders and backups run on a schedule
  min_machines_running = 1
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"
