<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Enquire about training · Diamond Protocol</title>
<link rel="icon" href="/img/mark-64.png">
<link rel="stylesheet" href="/css/dp.css">
<style>
.eq-page{max-width:600px;margin:0 auto;padding:24px 16px 56px;display:flex;flex-direction:column;gap:var(--space-4)}
.eq-logo{width:120px;height:120px;display:block;margin:0 auto}
.eq-page.embed{padding-top:12px}.eq-page.embed .eq-logo{display:none}
.eq-title{font:700 28px/1.1 var(--font-display);letter-spacing:.06em;text-transform:uppercase;margin:0}
.eq-sub{margin:6px 0 0;color:var(--steel-muted)}
.eq-two{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)}
.eq-three{display:grid;grid-template-columns:2fr 1fr 1fr;gap:var(--space-4)}
@media (max-width:520px){.eq-two,.eq-three{grid-template-columns:1fr}}
.eq-hp{position:absolute!important;left:-10000px!important;width:1px;height:1px;overflow:hidden}
.eq-consent{font-size:13px;line-height:19px;color:var(--steel-muted)}
.eq-consent input{margin-top:2px}
.eq-optional{font-weight:400;color:var(--steel-muted)}
.eq-done{text-align:center;padding:var(--space-10) var(--space-6)}
.eq-done h2{font:600 22px/1.3 var(--font-sans);margin:0 0 8px}
</style>
</head>
<body>
<main class="eq-page" id="page">
  <img class="eq-logo" src="/img/logo-320.png" alt="Diamond Protocol, built under pressure">
  <div><h1 class="eq-title">Enquire about training</h1>
    <p class="eq-sub" id="eq-sub">Tell us about your athlete and a coach will get back to you within one business day.</p></div>
  <form class="panel stack" id="eq" novalidate>
    <div class="eq-two">
      <div class="field"><label class="label" for="eq-name">Your name</label><input class="input" id="eq-name" name="parent_name" autocomplete="name" required maxlength="120"></div>
      <div class="field"><label class="label" for="eq-email">Email</label><input class="input" id="eq-email" name="email" type="email" inputmode="email" autocomplete="email" required maxlength="200"></div>
    </div>
    <div class="field"><label class="label" for="eq-phone">Mobile phone <span class="eq-optional">(optional)</span></label><input class="input" id="eq-phone" name="phone" type="tel" autocomplete="tel" maxlength="40" style="max-width:280px"></div>
    <div class="eq-three">
      <div class="field"><label class="label" for="eq-ath">Athlete’s name</label><input class="input" id="eq-ath" name="athlete_name" autocomplete="off" maxlength="80"><span class="hint">Leave blank if it’s you.</span></div>
      <div class="field"><label class="label" for="eq-age">Age</label><input class="input" id="eq-age" name="athlete_age" type="number" inputmode="numeric" min="4" max="70"></div>
      <div class="field"><label class="label" for="eq-grad">Grad year</label><input class="input" id="eq-grad" name="grad_year" type="number" inputmode="numeric" placeholder="2030"></div>
    </div>
    <div class="eq-two">
      <div class="field"><label class="label" for="eq-sport">Sport and position</label><input class="input" id="eq-sport" name="sport" list="eq-sports" maxlength="60" placeholder="Baseball, pitcher"></div>
      <div class="field"><label class="label" for="eq-int">Interested in</label><select class="input" id="eq-int" name="interest"><option value="">Not sure yet</option></select></div>
    </div>
    <datalist id="eq-sports"><option value="Baseball"><option value="Softball"><option value="Football"><option value="Soccer"><option value="Basketball"><option value="Volleyball"><option value="General fitness"></datalist>
    <div class="field"><label class="label" for="eq-msg">Anything we should know? <span class="eq-optional">(optional)</span></label><textarea class="input" id="eq-msg" name="message" rows="4" maxlength="2000" placeholder="Goals, injuries, the days that work for you"></textarea></div>
    <div class="eq-hp" aria-hidden="true"><label for="eq-web">Leave this empty</label><input id="eq-web" name="website" tabindex="-1" autocomplete="off"></div>
    <label class="check eq-consent"><input type="checkbox" name="sms_opt_in" id="eq-sms"> <span>OK to text me about this enquiry and training at <span class="biz">Diamond Protocol</span>. Message frequency varies. Msg &amp; data rates may apply. Reply STOP to opt out, HELP for help. Agreeing isn’t required to train with us.</span></label>
    <div class="error" id="eq-err" role="alert"></div>
    <div><button class="btn btn-primary btn-lg" type="submit">Send enquiry</button></div>
  </form>
</main>
<script src="/shared/enquire.js"></script>
</body>
</html>
