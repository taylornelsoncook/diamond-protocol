<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Progress report · Diamond Protocol</title>
<link rel="icon" href="/img/mark-64.png">
<link rel="stylesheet" href="/css/dp.css">
<style>
.rp-wrap{max-width:760px;margin:0 auto;padding:24px 16px 64px;display:flex;flex-direction:column;gap:16px}
.rp-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:28px;display:flex;flex-direction:column;gap:28px}
.rp-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
.rp-name{font:700 34px/1.05 var(--font-display);letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px}
.rp-meta{color:var(--steel-muted);font-size:14px;margin:0 0 4px}
.rp-logo{width:118px;height:118px;background:#000;border-radius:var(--radius-sm);flex-shrink:0;display:flex;align-items:center;justify-content:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rp-logo img{width:108px;height:108px}
.rp-h{font:600 13px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--silver);margin:0 0 12px}
.rp-note{border-left:3px solid var(--green-mid);background:var(--ground);padding:12px 16px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;margin:0;white-space:pre-wrap}
.rp-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rp-tile{border:1px solid var(--line);background:var(--ground);border-radius:var(--radius-sm);padding:12px 14px;display:flex;flex-direction:column;gap:4px;break-inside:avoid}
.rp-big{font:700 24px/1.1 var(--font-display);color:var(--green-bright)}
.rp-tile .t{font-weight:600;font-size:14px}
.rp-tile .s{font-size:13px;color:var(--steel-muted)}
.rp-table{width:100%;border-collapse:collapse;font-size:14px}
.rp-table th{font:500 12px/1 var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--steel-muted);text-align:left;padding:0 8px 10px 0;border-bottom:1px solid var(--line)}
.rp-table td{padding:12px 8px 12px 0;border-bottom:1px solid var(--line-subtle);vertical-align:middle}
.rp-table td.n{font-family:var(--font-mono);font-size:13px;white-space:nowrap}
.rp-table tr{break-inside:avoid}
.rp-table .sub{font-size:12px;color:var(--steel-muted)}
.good{color:var(--green-bright)} .bad{color:var(--amber)}
.rp-foot{font-size:13px;color:var(--steel-muted);margin:0}
.rp-auth{max-width:420px;margin:12vh auto 0;text-align:center}
@media (max-width:640px){
  .rp-card{padding:20px 16px}
  .rp-head{flex-direction:column-reverse}
  .rp-logo{width:84px;height:84px}.rp-logo img{width:76px;height:76px}
  .rp-name{font-size:28px}
  .rp-tiles{grid-template-columns:1fr 1fr}
  .rp-table .hide-sm{display:none}
}
@media print{
  @page{margin:14mm}
  .rp-wrap{padding:0;max-width:none}
  .rp-card{border:0;padding:0;background:#fff;gap:20px}
  .rp-note,.rp-tile{background:#fff}
  .rp-note{border-left-color:#2F6B34}
  .good{color:#2F6B34} .bad{color:#8a5a00}
  .spark polyline{stroke:#2F6B34}.spark circle{fill:#2F6B34}
  .rp-coach{border:1px solid #8a5a00;background:#fff4e0;color:#8a5a00;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="root" class="rp-wrap"><p class="muted" aria-busy="true">Loading…</p></div>
<script type="module" src="/shared/report.js"></script>
</body>
</html>
