# Render Blueprint: two copies of the app, each with its own disk for the database and backups.
# In Render: New > Blueprint > pick this repo. See docs/DEPLOY.md.
services:
  # Staging: demo data, test-mode payments. Try every change here first.
  - type: web
    name: diamond-protocol-staging
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DP_DATA_DIR
        value: /data
      - key: DP_DEMO
        value: "1"
      # Email (optional on staging): set in the Render dashboard, never in this file.
      - key: RESEND_API_KEY
        sync: false
      - key: DP_EMAIL_FROM
        sync: false
      # Staging only delivers to these addresses (e.g. your own); demo families never get real email.
      - key: DP_EMAIL_ONLY_TO
        sync: false

  # Production: real families. Starts empty and asks you to create the owner account.
  # Deploys only when you press Manual Deploy, so nothing reaches families untested.
  - type: web
    name: diamond-protocol
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    healthCheckPath: /healthz
    autoDeploy: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DP_DATA_DIR
        value: /data
      - key: RESEND_API_KEY
        sync: false
      - key: DP_EMAIL_FROM
        sync: false
